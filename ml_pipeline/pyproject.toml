[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gyansetu-ml-pipeline"
version = "0.1.0"
description = "GyanSetu machine-learning and assessment pipeline"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.23.0",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[tool.setuptools]
package-dir = {"ml_pipeline" = "."}
packages = ["ml_pipeline"]
include-package-data = true

[tool.setuptools.package-data]
ml_pipeline = ["prompts/*.txt"]
